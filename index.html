<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teneryfa rowerem 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Robocza strona: pasek dni, potem każdy dzień = karty opcji (mapka, trasa przez miejscowości, liczby, profil, GPX) */
:root{
  --bg:#eef1f2; --card:#ffffff; --fg:#1c2326; --muted:#5b686e; --line:#d3d9dc; --soft:#e4eaec;
  --lava:#c94a22; --pine:#3d7a4c; --sun:#b7791f; --sea:#2d6c8c; --on:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11171a; --card:#192125; --fg:#e4eaec; --muted:#93a2a9; --line:#2b373c; --soft:#222c31;
  --lava:#f0754b; --pine:#71b884; --sun:#e0a64a; --sea:#6db1d3; --on:#11171a; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 48px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2rem,6vw,3rem)}
h2{font-size:clamp(1.7rem,5vw,2.3rem)}
h3{font-size:1.35rem}
p{margin:0}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lava)}
header{display:grid;gap:8px}

nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
  background:var(--bg);padding-block:8px;margin-block:-8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1001;background:var(--bg)}
nav.days a{display:grid;gap:2px;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
nav.days a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
nav.days b{font:700 1.1rem/1 var(--display)}
nav.days span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.day{display:grid;gap:12px;scroll-margin-top:76px}
.dayhead{display:grid;gap:6px}
.note{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.top{display:flex;align-items:center;gap:10px}
.no{font:700 1.4rem/1 var(--display);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--on);background:var(--c);flex:none}
.lvl{font:600 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.opt.l1{--c:var(--pine)} .opt.l2{--c:var(--sun)} .opt.l3{--c:var(--lava)}
.via{font-size:.95rem;line-height:1.4}
.via b{font-weight:700}
.via span{color:var(--muted)}
.map{height:210px;border-radius:8px;border:1px solid var(--line);background:var(--soft);z-index:0}
.leaflet-container{font:inherit}
.pin{font:600 11px/1.1 var(--body);color:#1c2326;background:rgba(255,255,255,.93);border:1px solid rgba(0,0,0,.3);border-radius:4px;padding:2px 5px;white-space:nowrap;transform:translate(-50%,-140%);display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-block:1px solid var(--line);padding-block:8px}
.stats div{display:grid;gap:3px;min-width:0}
.stats b{font:600 1.2rem/1 var(--mono);font-variant-numeric:tabular-nums}
.stats span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.surf{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:3px}
.surf i{display:block;height:100%;background:var(--c)}
svg.prof{width:100%;height:auto;display:block}
.prof .area{fill:var(--c);opacity:.16}
.prof .ln{fill:none;stroke:var(--c);stroke-width:2;vector-effect:non-scaling-stroke}
.prof .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.prof text{font:500 11px var(--mono);fill:var(--muted)}
.prof .mk{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.prof .mkt{fill:var(--fg);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font:700 1.05rem/1 var(--body);
  padding:14px 16px;border-radius:10px;background:var(--c);color:var(--on);min-height:48px}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn svg{width:20px;height:20px;flex:none}
.esc{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--soft)}
.esc p{font-size:.93rem}
.btn2{display:inline-flex;align-items:center;gap:8px;justify-self:start;text-decoration:none;font:600 .92rem/1 var(--body);
  padding:10px 12px;border-radius:8px;border:1px solid var(--fg);color:var(--fg);min-height:40px}
.btn2:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.btn2 svg{width:16px;height:16px}
footer{font-size:.82rem;color:var(--muted)}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">29.11–1.12.2026</p>
    <h1>Teneryfa rowerem</h1>
  </header>
  <nav class="days" id="nav" aria-label="Dni"></nav>
  <main id="days" style="display:grid;gap:40px"></main>
  <footer>Mapa © OpenStreetMap, OpenTopoMap. Trasy i przewyższenia: BRouter.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M6 10l6 6 6-6M4 20h16"/></svg>';
const LV={"łatwa":1,"średnia":2,"mocna":3};
const COL={1:'#3d7a4c',2:'#b7791f',3:'#c94a22'};
const fmt=n=>String(n).replace('.',',');
const h=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function profile(o,ymin,ymax){
  const W=380,H=110,L=36,R=6,T=8,B=20,pw=W-L-R,ph=H-T-B;
  const km=o.prof[o.prof.length-1][0];
  const x=k=>L+k/km*pw, y=e=>T+ph-(e-ymin)/(ymax-ymin)*ph;
  const pts=o.prof.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
  let g='';
  const step=ymax-ymin>1200?500:ymax-ymin>500?250:100;
  for(let e=Math.ceil(ymin/step)*step;e<=ymax;e+=step){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(e)}" y2="${y(e)}"/><text x="${L-5}" y="${y(e)+4}" text-anchor="end">${e}</text>`}
  const ks=km>50?25:km>20?10:5;
  for(let k=0;k<=km;k+=ks){g+=`<text x="${x(k)}" y="${H-5}" text-anchor="${k===0?'start':'middle'}">${k} km</text>`}
  let mk='';
  if(o.escape&&o.escape.km_at!=null){const X=x(o.escape.km_at),r=X>W*0.7;
    mk=`<line class="mk" x1="${X}" x2="${X}" y1="${T}" y2="${T+ph}"/><text class="mkt" x="${X+(r?-5:5)}" y="${T+11}" text-anchor="${r?'end':'start'}">zjazd: ${h(o.escape.at)}</text>`}
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" role="img" aria-label="Profil: ${o.emin}–${o.emax} m n.p.m.">${g}<polygon class="area" points="${x(0)},${T+ph} ${pts} ${x(km)},${T+ph}"/><polyline class="ln" points="${pts}"/>${mk}</svg>`;
}

function via(v){
  if(!v||!v.length)return '';
  return v.map((s,i)=>i===0||i===v.length-1?`<b>${h(s)}</b>`:`<span>${h(s)}</span>`).join(' → ');
}

function card(d,o,i,ymin,ymax){
  const n=LV[o.level];
  let esc='';
  if(o.escape){const e=o.escape;
    esc=`<div class="esc"><p><b>Zjazd${e.km_at!=null?` (km ${fmt(e.km_at)})`:''}:</b> ${h(e.text.replace(/^Jeśli jest źle: /,''))}</p>${e.file?`<a class="btn2" href="gpx/${e.file}" download>${DL}Skrót GPX · ${fmt(e.km)} km, +${e.up} m</a>`:''}</div>`}
  return `<article class="opt l${n}">
    <div class="top"><span class="no">${o.n}</span><h3>${h(o.title)}</h3></div>
    <p class="via">${via(o.via)}</p>
    <div class="map" id="m-${d.id}-${i}" aria-label="Mapa trasy"></div>
    <div class="stats">
      <div><b>${fmt(o.km)}</b><span>km</span></div>
      <div><b>+${o.up}</b><span>m w górę</span></div>
      <div><b>${o.unp}%</b><span>szuter</span><div class="surf"><i style="width:${o.unp}%"></i></div></div>
    </div>
    ${profile(o,ymin,ymax)}
    <a class="btn" href="gpx/${o.file}" download>${DL}GPX opcja ${o.n}</a>
    ${esc}
  </article>`;
}

function maps(days){
  if(!window.L)return;
  const pin=(m,ll,txt)=>L.marker(ll,{icon:L.divIcon({className:'',html:`<span class="pin">${h(txt)}</span>`,iconSize:[0,0]}),interactive:false}).addTo(m);
  days.forEach(d=>d.options.forEach((o,i)=>{ if(!o.ll)return;
    const m=L.map(`m-${d.id}-${i}`,{zoomControl:false,attributionControl:false,dragging:!L.Browser.mobile,scrollWheelZoom:false,touchZoom:true,doubleClickZoom:true,tap:false});
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:15,subdomains:'abc'}).addTo(m);
    d.options.forEach((p,j)=>{if(j!==i&&p.ll)L.polyline(p.ll,{color:'#7b878c',weight:2,opacity:.55,interactive:false}).addTo(m)});
    if(o.escape&&o.escape.ll)L.polyline(o.escape.ll,{color:'#1c2326',weight:3,dashArray:'5 6',interactive:false}).addTo(m);
    const line=L.polyline(o.ll,{color:'#fff',weight:7,opacity:.9,interactive:false}).addTo(m);
    L.polyline(o.ll,{color:COL[LV[o.level]],weight:4,interactive:false}).addTo(m);
    const a=o.ll[0],b=o.ll[o.ll.length-1];
    L.circleMarker(a,{radius:6,color:'#fff',weight:2,fillColor:'#1c2326',fillOpacity:1}).addTo(m);
    L.circleMarker(b,{radius:6,color:'#1c2326',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(m);
    pin(m,a,(o.via||[""])[0]);
    const end=(o.via||[""]).slice(-1)[0];
    if(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])>0.005)pin(m,b,end);
    m.fitBounds(line.getBounds(),{padding:[22,22]});
  }));
}

fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(days=>{
  document.getElementById('nav').innerHTML=days.map(d=>`<a href="#${d.id}"><b>${h({Niedziela:'Nd',Poniedziałek:'Pn',Wtorek:'Wt'}[d.date.split(' ')[0]]||d.date.split(' ')[0])} ${h(d.date.split(' ')[1]||'')}</b><span>${h(d.from)} → ${h(d.to.replace(/ \(.*/,''))}</span></a>`).join('');
  document.getElementById('days').innerHTML=days.map(d=>{
    const all=d.options.flatMap(o=>o.prof.map(p=>p[1]));
    const ymin=Math.max(0,Math.floor(Math.min(...all)/100)*100), ymax=Math.ceil(Math.max(...all)/100)*100;
    return `<section class="day" id="${d.id}">
      <div class="dayhead"><p class="eyebrow">${h(d.date)}</p><h2>${h(d.from)} → ${h(d.to)}</h2>
      <p class="note">${h(d.lead)}</p></div>
      <div class="opts">${d.options.map((o,i)=>card(d,o,i,ymin,ymax)).join('')}</div></section>`;
  }).join('');
  maps(days);
  if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
}).catch(()=>{document.getElementById('days').innerHTML='<p>Nie udało się wczytać tras. Odśwież stronę.</p>'});
</script>
</body>
</html>
